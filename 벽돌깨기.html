<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1747;        /* 교실 칠판 같은 짙은 남보라 */
    --field: #26205c;     /* 게임판 */
    --ink: #fff8e7;       /* 글자 */
    --paddle: #ffcc33;    /* 자(노랑) */
    --heart: #ff5c7a;     /* 생명 */
    --btn: #ff8a3d;       /* 버튼 */
    --btn-ink: #2a1500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 상단 상태판: 프로젝터 뒷자리에서도 읽히도록 크게 */
  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px clamp(16px, 4vw, 56px);
    font-size: clamp(24px, 3.4vw, 46px);
    line-height: 1.1;
  }
  #hud .item { display: flex; align-items: baseline; gap: 10px; }
  #hud .label { opacity: .75; font-size: .7em; }
  #hud .value { color: var(--paddle); }
  #lives { color: var(--heart); letter-spacing: 2px; }

  #wrap {
    position: relative;
    width: min(97vw, calc((100vh - 170px) * 1.6));
    aspect-ratio: 16 / 10;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 18px;
    background: var(--field);
    box-shadow: 0 0 0 6px #3a3280;
    touch-action: none;
    cursor: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.5vh, 28px);
    padding: 20px;
    text-align: center;
    background: rgba(20, 15, 55, .86);
    border-radius: 18px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(44px, 8vw, 110px);
    font-weight: normal;
    color: var(--paddle);
    line-height: 1;
    text-shadow: 0 6px 0 #b8541a;
  }
  #overlay p {
    font-size: clamp(22px, 3vw, 40px);
    line-height: 1.45;
    max-width: 30ch;
  }
  #buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  #overlay button {
    font-family: inherit;
    font-size: clamp(26px, 3.6vw, 48px);
    padding: .35em 1.2em;
    border: none;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    cursor: pointer;
    box-shadow: 0 6px 0 #a3480f;
  }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3480f; }
  #overlay button:focus-visible { outline: 5px solid var(--ink); outline-offset: 4px; }

  #help {
    font-size: clamp(18px, 2.2vw, 30px);
    opacity: .85;
    text-align: center;
  }
  kbd {
    font-family: inherit;
    background: #3a3280;
    border-radius: 8px;
    padding: 0 .4em;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="item"><span class="label">점수</span><span class="value" id="score">0</span></div>
  <div class="item"><span class="label">생명</span><span id="lives">♥♥♥</span></div>
  <div class="item"><span class="label">단계</span><span class="value" id="stage">1 / 3</span></div>
  <div class="item"><span class="label">공 속도</span><span class="value" id="speed">보통</span></div>
</div>

<div id="wrap">
  <canvas id="game" width="960" height="600" aria-label="벽돌깨기 게임 화면"></canvas>
  <div id="overlay">
    <h1 id="ov-title">벽돌깨기</h1>
    <p id="ov-msg"></p>
    <div id="buttons"></div>
  </div>
</div>

<div id="help">
  <kbd>←</kbd> <kbd>→</kbd> 또는 마우스·터치로 자 이동 &nbsp;|&nbsp; <kbd>스페이스</kbd> 발사·일시정지
</div>

<script>
(() => {
  // ===== 기본 설정 =====
  const W = 960, H = 600;
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');

  const MAX_LIFE = 5;
  const START_LIFE = 3;
  const MAX_STAGE = 3;
  const COLS = 10;

  // 단계별 설정: 줄 수, 공 속도(초당 이동 거리), 속도 이름
  const STAGES = [
    { rows: 4, speed: 380, speedName: '보통' },
    { rows: 5, speed: 480, speedName: '빠름' },
    { rows: 6, speed: 580, speedName: '아주 빠름' }
  ];
  const ROW_COLORS = ['#ff5c7a', '#ff8a3d', '#ffcc33', '#5ee08a', '#4cc9f0', '#b28dff'];

  // ===== 상태 =====
  let score = 0, lives = START_LIFE, stage = 1;
  // state: 'menu' | 'serve' | 'play' | 'pause' | 'clear' | 'over' | 'win'
  let state = 'menu';

  const paddle = { w: 150, h: 20, x: W / 2 - 75, y: H - 44, speed: 760 };
  const ball = { r: 11, x: W / 2, y: H - 60, vx: 0, vy: 0 };
  let bricks = [];
  const keys = { left: false, right: false };

  // ===== 화면 요소 =====
  const $score = document.getElementById('score');
  const $lives = document.getElementById('lives');
  const $stage = document.getElementById('stage');
  const $speed = document.getElementById('speed');
  const $overlay = document.getElementById('overlay');
  const $ovTitle = document.getElementById('ov-title');
  const $ovMsg = document.getElementById('ov-msg');
  const $buttons = document.getElementById('buttons');

  function updateHud() {
    $score.textContent = score;
    $lives.textContent = '♥'.repeat(lives) + '♡'.repeat(MAX_LIFE - lives);
    $stage.textContent = stage + ' / ' + MAX_STAGE;
    $speed.textContent = STAGES[stage - 1].speedName;
  }

  function showOverlay(title, msg, buttons) {
    $ovTitle.textContent = title;
    $ovMsg.innerHTML = msg;
    $buttons.innerHTML = '';
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.textContent = b.label;
      el.addEventListener('click', () => { el.blur(); b.action(); });
      $buttons.appendChild(el);
    });
    $overlay.classList.remove('hidden');
    const first = $buttons.querySelector('button');
    if (first) first.focus();
  }
  function hideOverlay() { $overlay.classList.add('hidden'); }

  // ===== 벽돌 만들기 =====
  function buildBricks() {
    bricks = [];
    const rows = STAGES[stage - 1].rows;
    const side = 30, gap = 8, top = 60, bh = 30;
    const bw = (W - side * 2 - gap * (COLS - 1)) / COLS;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < COLS; c++) {
        // 2단계: 가운데가 비어 있는 모양 / 3단계: 맨 윗줄은 두 번 맞아야 깨지는 단단한 벽돌
        if (stage === 2 && r >= 1 && r <= 3 && (c === 4 || c === 5)) continue;
        const hard = (stage === 3 && r === 0);
        bricks.push({
          x: side + c * (bw + gap),
          y: top + r * (bh + gap),
          w: bw, h: bh,
          hits: hard ? 2 : 1,
          hard,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true
        });
      }
    }
  }

  // ===== 게임 흐름 =====
  function readyServe() {
    state = 'serve';
    ball.vx = 0; ball.vy = 0;
    placeBallOnPaddle();
  }
  function placeBallOnPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }
  function launch() {
    const sp = STAGES[stage - 1].speed;
    const angle = (Math.random() * 0.8 - 0.4); // 위쪽으로 약간 기울어지게
    ball.vx = sp * Math.sin(angle);
    ball.vy = -sp * Math.cos(angle);
    state = 'play';
  }

  function startGame() {
    score = 0; lives = START_LIFE; stage = 1;
    buildBricks();
    updateHud();
    hideOverlay();
    readyServe();
  }
  function nextStage() {
    stage = Math.min(stage + 1, MAX_STAGE);
    buildBricks();
    updateHud();
    hideOverlay();
    readyServe();
  }

  function pause() {
    state = 'pause';
    showOverlay('일시정지', '<kbd>스페이스</kbd>를 누르면 이어서 합니다.', [
      { label: '계속하기', action: resume }
    ]);
  }
  function resume() { hideOverlay(); state = 'play'; }

  function loseLife() {
    lives--;
    updateHud();
    if (lives <= 0) {
      state = 'over';
      showOverlay('게임 끝', '최종 점수 <b>' + score + '점</b><br>다시 도전해 볼까요?', [
        { label: '다시하기', action: startGame }
      ]);
    } else {
      readyServe();
    }
  }

  function stageCleared() {
    if (stage >= MAX_STAGE) {
      state = 'win';
      showOverlay('모두 깼어요!', '3단계까지 성공했어요.<br>최종 점수 <b>' + score + '점</b>', [
        { label: '다시하기', action: startGame }
      ]);
      return;
    }
    state = 'clear';
    const gained = lives < MAX_LIFE;
    lives = Math.min(MAX_LIFE, lives + 1);
    updateHud();
    showOverlay(stage + '단계 성공!',
      (gained ? '보너스로 생명이 1개 늘었어요.<br>' : '생명이 이미 최대(5개)예요.<br>') +
      '다음 단계는 공이 더 빨라져요.', [
      { label: '다음 단계', action: nextStage }
    ]);
  }

  // ===== 움직임과 충돌 =====
  function update(dt) {
    // 자 이동 (키보드)
    if (keys.left) paddle.x -= paddle.speed * dt;
    if (keys.right) paddle.x += paddle.speed * dt;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (state === 'serve') { placeBallOnPaddle(); return; }
    if (state !== 'play') return;

    // 빠른 공이 벽돌을 뚫고 지나가지 않도록 잘게 나눠서 이동
    const sp = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil(sp * dt / (ball.r * 0.5)));
    const sdt = dt / steps;

    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // 벽
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      // 자: 맞은 위치에 따라 튕기는 각도가 달라짐
      if (ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y + ball.r <= paddle.y + paddle.h + 6 &&
          ball.x >= paddle.x - ball.r &&
          ball.x <= paddle.x + paddle.w + ball.r) {
        let t = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        t = Math.max(-1, Math.min(1, t));
        const angle = t * (Math.PI / 3); // 최대 60도
        ball.vx = sp * Math.sin(angle);
        ball.vy = -sp * Math.cos(angle);
        ball.y = paddle.y - ball.r - 0.5;
      }

      // 벽돌
      for (const b of bricks) {
        if (!b.alive) continue;
        const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy < ball.r * ball.r) {
          if (Math.abs(dx) > Math.abs(dy)) {
            ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
          } else if (dy !== 0) {
            ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          } else {
            ball.vy = -ball.vy;
          }
          b.hits--;
          if (b.hits <= 0) {
            b.alive = false;
            score += 10 * stage;
          } else {
            score += 5;
          }
          updateHud();
          break;
        }
      }

      // 바닥으로 떨어짐
      if (ball.y - ball.r > H) { loseLife(); return; }
    }

    if (bricks.every(b => !b.alive)) stageCleared();
  }

  // ===== 그리기 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 벽돌
    for (const b of bricks) {
      if (!b.alive) continue;
      if (b.hard && b.hits === 2) {
        ctx.fillStyle = '#d9d4f5';
      } else {
        ctx.fillStyle = b.color;
      }
      roundRect(b.x, b.y, b.w, b.h, 7);
      ctx.fill();
      // 윗면 반짝임
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      roundRect(b.x + 4, b.y + 3, b.w - 8, 7, 4);
      ctx.fill();
      // 단단한 벽돌 표시
      if (b.hard) {
        ctx.strokeStyle = '#3a3280';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (b.hits === 2) {
          ctx.moveTo(b.x + b.w / 2 - 10, b.y + b.h / 2 + 2);
          ctx.lineTo(b.x + b.w / 2 + 10, b.y + b.h / 2 + 2);
        } else { // 금이 간 모양
          ctx.moveTo(b.x + b.w * .3, b.y + 6);
          ctx.lineTo(b.x + b.w * .45, b.y + b.h / 2);
          ctx.lineTo(b.x + b.w * .38, b.y + b.h - 5);
        }
        ctx.stroke();
      }
    }

    // 자
    ctx.fillStyle = '#ffcc33';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    roundRect(paddle.x + 8, paddle.y + 4, paddle.w - 16, 5, 3);
    ctx.fill();

    // 공
    ctx.fillStyle = '#fff8e7';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // 발사 안내
    if (state === 'serve') {
      ctx.fillStyle = '#fff8e7';
      ctx.textAlign = 'center';
      ctx.font = '44px "Jua", "Malgun Gothic", sans-serif';
      ctx.fillText(stage + '단계', W / 2, H * 0.62);
      ctx.font = '34px "Jua", "Malgun Gothic", sans-serif';
      ctx.fillText('스페이스(또는 화면 터치)로 발사!', W / 2, H * 0.62 + 50);
    }
  }

  // ===== 반복 =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 입력 =====
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    else if (e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'serve') launch();
      else if (state === 'play') pause();
      else if (state === 'pause') resume();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft') keys.left = false;
    else if (e.code === 'ArrowRight') keys.right = false;
  });

  // 마우스·터치: 손가락(커서) 위치로 자 이동
  function movePaddleTo(clientX) {
    const rect = cvs.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width * W;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }
  cvs.addEventListener('pointermove', e => {
    if (state === 'play' || state === 'serve') movePaddleTo(e.clientX);
  });
  cvs.addEventListener('pointerdown', e => {
    if (state === 'play' || state === 'serve') movePaddleTo(e.clientX);
    if (state === 'serve') launch(); // 키보드가 없는 기기를 위한 터치 발사
  });

  // ===== 시작 화면 =====
  buildBricks();
  updateHud();
  placeBallOnPaddle();
  showOverlay('벽돌깨기',
    '공을 튕겨 벽돌을 모두 깨세요!<br>단계가 올라갈수록 공이 빨라집니다.', [
    { label: '시작', action: startGame }
  ]);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
